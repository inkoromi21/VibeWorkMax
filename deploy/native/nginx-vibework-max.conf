server {
    listen 443 ssl;
    listen [::]:443 ssl ipv6only=on;
    server_name vibeworkrussia.ru www.vibeworkrussia.ru;

    ssl_certificate /etc/letsencrypt/live/vibeworkrussia.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vibeworkrussia.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /opt/vibeworkmax/apps/web/dist;
    index index.html;

    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
    }

    location = /webhooks/max {
        proxy_pass http://127.0.0.1:3000/webhooks/max;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name vibeworkrussia.ru www.vibeworkrussia.ru;
    return 301 https://$host$request_uri;
}
